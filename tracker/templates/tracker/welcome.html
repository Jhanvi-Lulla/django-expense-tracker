{% extends 'tracker/base.html' %}
{% load static %}

{% block content %}
<div class="text-center">
  <h2 class="mb-3">Welcome to Expense Tracker</h2>
  <img src="{% static 'expense 2.webp' %}" alt="Expense tracker" class="img-fluid mb-4" style="max-width: 700px;">
  <div>
    {% if user.is_authenticated %}
      <a class="btn btn-primary" href="{% url 'index' %}">Go to my expenses</a>
    {% else %}
      <a class="btn btn-primary me-2" href="{% url 'login' %}">Login</a>
      <a class="btn btn-outline-primary" href="{% url 'register' %}">Sign Up</a>
    {% endif %}
  </div>
</div>
{% endblock %}
