{% extends 'tracker/base.html' %}
{% load static %}

{% block title %}Total expenses{% endblock %}

{% block content %}
<div class="text-center">
  <img src="{% static 'Expense_report.jpg' %}" alt="" class="img-fluid mb-3" style="max-height: 220px;">
  <h4>{{ username }}, your total expenses</h4>
  <p class="fs-5">Dear {{ username }}, your expenses total <b>Rs. {{ total_sum }}</b></p>
  <a class="btn btn-outline-secondary" href="{% url 'index' %}">Back to my expenses</a>
</div>
{% endblock %}
